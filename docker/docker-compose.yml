# customer360_kafka_to_postgresql — Local development environment
# Generated by Canvode Docker compiler
# Usage: docker compose up -d

version: "3.9"

services:
    spark:
      build:
        context: ..
        dockerfile: docker/Dockerfile
      container_name: customer360-kafka-to-postgresql-spark
      environment:
        - SPARK_LOCAL_IP=localhost
        - SPARK_MASTER=local[*]
      env_file:
        - .env.local
      volumes:
        - ../spark:/app
      networks:
        - pipeline-net

    postgres:
      image: postgres:15-alpine
      container_name: customer360-kafka-to-postgresql-postgres
      environment:
        POSTGRES_DB: ${SOURCE_DB:-mydb}
        POSTGRES_USER: ${SOURCE_USER:-user}
        POSTGRES_PASSWORD: ${SOURCE_PASSWORD:-password}
      ports:
        - "5432:5432"
      volumes:
        - postgres-data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
        - pipeline-net

    zookeeper:
      image: confluentinc/cp-zookeeper:7.5.0
      container_name: zookeeper
      environment:
        ZOOKEEPER_CLIENT_PORT: 2181
      networks:
        - pipeline-net

    kafka:
      image: confluentinc/cp-kafka:7.5.0
      container_name: customer360-kafka-to-postgresql-kafka
      depends_on: [zookeeper]
      ports:
        - "9092:9092"
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      networks:
        - pipeline-net

networks:
  pipeline-net:
    driver: bridge

volumes:
  postgres-data:
