version: 2

sources:
  - name: kafka_customer_events
    description: "Source system for the customer360_kafka_to_postgresql pipeline"
    database: "{{ target.project }}"
    schema: public
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}
    loaded_at_field: event_timestamp
    tables:
      - name: customer_events
        description: "Raw source table — loaded by ELT/Airflow before dbt runs"
        columns:
          - name: customer_id
          - name: event_timestamp
          - name: email
            meta:
              pii: true
          - name: phone
            meta:
              pii: true
          - name: product_id
          - name: amount
          - name: currency
          - name: event_type
