name: 'customer360_kafka_to_postgresql'
version: '1.0.0'
config-version: 2

profile: 'dw_postgres'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  customer360_kafka_to_postgresql:
    staging:
      +materialized: view
      +tags: ['staging']
      +schema: staging
    intermediate:
      +materialized: table
      +tags: ['intermediate']
      +schema: intermediate
    marts:
      +materialized: incremental
      +tags: ['mart', 'production']
      +schema: marts
      +on_schema_change: 'append_new_columns'

vars:
  run_date: '1900-01-01'  # override: dbt run --vars '{"run_date": "2024-01-01"}'
